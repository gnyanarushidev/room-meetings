# Import this repository as a Blueprint on Render.
services:
  - type: web
    name: gather-meetings-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1 --ws-max-size 131072 --ws-ping-interval 20 --ws-ping-timeout 20 --proxy-headers --forwarded-allow-ips '*'
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: gather_meetings
      - key: CORS_ORIGINS
        sync: false
      - key: ROOM_CAPACITY
        value: '100'
